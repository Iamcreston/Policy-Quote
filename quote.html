<!DOCTYPE html>
<html lang="en">
<head>
    <title> Policy Quote Form</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f9fafb;
            color: #1f2937;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }
        label {
display: block;
font-size: 0.85rem;
color: #6b7280;
margin-top: 1rem;
margin-bottom: 0.3rem;
}
input, select {
width: 100%;
padding: 0.5rem 0.75rem;
border: 1px solid #d1d5db;
border-radius: 6px;
font-size: 0.95rem;
}
button {
margin-top: 1.5rem;
background: #1d4ed8;
color: white;
border: none;
padding: 0.7rem 1.5rem;
border-radius: 6px;
cursor: pointer;
font-size: 1rem;
}
button:hover {
background: #1e40af;
}
#memo-output {
margin-top: 2rem;
background: white;
border: 1px solid #d1d5db;
border-radius: 8px;
padding: 1.5rem;
}

    </style>
</head>
<body>

<h1>Policy Quote Form</h1>

<label>Line of Business</label>
<select id="lob">
    <option value="">-- Select --</option>
    <option value="auto">Personal Auto</option>
    <option value="motorcycle">Motorcycle</option>
    <option value="home">Homeowners</option>
    <option value="flood">Flood</option>
</select>

<script>
$(function() {

    $('#lob').on('change', function() {
        $('#section-auto, #section-home, #section-flood, #section-motorcycle').hide();
        var selected = $(this).val();
        if (selected) {
            $('#section-' + selected).show();
        }
    });

    $('#btn-submit').on('click', function() {
        var valid = true;

        if ($('#fname').val().trim() === '') {
            valid = false;
        }
        if ($('#lob').val() === '') {
            valid = false;
        }
        if (!valid) {
            $('#error-msg').show();
            return;
        }

        var coverages = [];
        $('input[type=checkbox]:checked').each(function() {
            coverages.push($(this).val());
        });

        $('#error-msg').hide();
        generateMemo(coverages);
    });

    console.log('jQuery is ready');
});

function generateMemo(coverages) {
    var fname = $('#fname').val();
    var lname = $('#lname').val();
    var lob = $('#lob option:selected').text();
    var effDate = $('#eff-date').val();
    var deduct = $('#deductible').val();

    var html = '<h2>Policy Quote Memo</h2>';
    html += '<p><strong>Name:</strong> ' + fname + ' ' + lname + '</p>';
    html += '<p><strong>Line of Business:</strong> ' + lob + '</p>';
    html += '<p><strong>Effective Date:</strong> ' + effDate + '</p>';
    html += '<p><strong>Deductible:</strong> $' + deduct + '</p>';
    html += '<p><strong>Selected Coverages:</strong> ' + (coverages.length ? coverages.join(', ') : 'None selected') + '</p>';

    $('#memo-output').html(html).fadeIn(300);
}
</script>

<label>First Name</label>
<input type="text" id="fname" placeholder="Jane" />

<label>Last Name</label>
<input type="text" id="lname" placeholder="Doe" />

<label>Effective Date</label>
<input type="date" id="eff-date" />

<label>Deductible</label>
<select id="deductible">
  <option value="500">$500</option>
  <option value="1000">$1,000</option>
  <option value="2500">$2,500</option>
</select>

<!-- Add this div below your other sections -->
 <div id="section-motorcycle" style="display:none;">
    <h3>Motorcycle Details</h3>
    <label>Vehicle Make/Model</label>
    <input type="text" id="m-make" placeholder="Harley Davidson Street 750"/>
</div>

<div id="section-flood" style="display:none;">
<h3>Flood Details</h3>
<label>Flood Zone</label>
<select id="f-zone">
<option value="">-- Select --</option>
<option value="a">Zone A</option>
<option value="ae">Zone AE</option>
<option value="x">Zone X</option>
</select>
<label>Building Value ($)</label>
<input type="number" id="f-value" placeholder="180000" />
</div>

<div id="section-auto" style="display:none;">
    <h3>Auto Details</h3>
    <label>Vehicle Make/Model</label>
    <input type="text" id="v-make" placeholder="Honda Civic" />

    <!--Coverage Options-->
    <fieldset>
        <legend> Coverage Options</legend>
        <label>
            <input type="checkbox" value="Liability" /> Liability
        </label>
        <label>
            <input type="checkbox" value="collision" /> Collision
        </label>
        <label>
            <input type="checkbox" value="comprehensive" /> Comprehensive
        </label>
        <label>
            <input type="checkbox" value="uninsured" /> Uninsured Motorist
        </label>
    </fieldset>

</div>

<div id="section-home" style="display:none;">
    <h3>Home Details</h3>
    <label> Property Address</label>
    <input type="text" id="h-address" placeholder="5150 Cyper rd" />
</div>

<button id="btn-submit">Generate Quote</button>
<p id="error-msg" style="color:red; display:none;">
    Please Fill In All Required Fields.
</p>
<div id="memo-output" style="display:none; border:1px solid #ccc; padding: 20px;">
</div>



</body>
</html>
